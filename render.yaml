# Render Blueprint — deploy the API only (FastAPI).
# Streamlit stays local or on Streamlit Cloud; point it at this URL.
#
# ─────────────────────────────────────────────────────────────────────────────
# THE LIVE SERVICE IS:   https://ai-eng-bootcamp-v4if.onrender.com
#
# Check that host and no other. Verified 2026-10-27: /health returns
# memory_backend "postgres" with memory_reachable true, and the route table
# includes /ping.
#
# NOT ours — do not probe, do not "fix":
#   https://ai-eng-bootcamp-api.onrender.com   old, abandoned Week-1 build;
#                                              serves only /ask and /health
#   https://ai-eng-bootcamp.onrender.com       someone else's app entirely
#
# Both of those answer 200 on /health, so a live check against either one
# looks like a successful check of a stale deployment. That has now happened
# twice and once produced the wrong conclusion that auto-deploy was broken —
# F11 in evals/FINDINGS.md. Auto-deploy works: 6a21a4f was live within
# minutes of the push.
# ─────────────────────────────────────────────────────────────────────────────
services:
  - type: web
    # Matches the live hostname above. UNVERIFIED against the dashboard: Render
    # appends a random suffix to the URL when a service name is already taken,
    # and `ai-eng-bootcamp` is taken, so the dashboard name may be
    # `ai-eng-bootcamp` with `-v4if` added only to the host. Confirm the exact
    # name in Dashboard → the service → Settings BEFORE any Blueprint sync: a
    # name that does not match an existing service makes Render create a second
    # one rather than update this one.
    name: ai-eng-bootcamp-v4if
    runtime: docker
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"
      # ── Watchbird memory store — ACTIVE ───────────────────────────────
      # The store needs DATABASE_URL to reach the service, or server/memory.py
      # falls back to SQLite on a container with no persistent disk: memory
      # that passes a demo and loses everything on the next restart (F9).
      #
      # `sync: false` means the value is set in the Render dashboard and never
      # enters this repo, which satisfies the same rule `fromDatabase` does.
      #
      # Why NOT `fromDatabase` here: a Postgres instance already exists and
      # already holds the stories table. `fromDatabase` tells Render to create
      # a NEW database named watchbird-db, which would (a) start empty, so the
      # recall proof would have nothing to recall, and (b) need a second free
      # instance, and Render allows one free Postgres per workspace.
      #
      # Set it in: Dashboard → the service → Environment → DATABASE_URL.
      # Use the database's INTERNAL connection string when the service and the
      # database are in the same region — it does not traverse the public
      # internet and is not subject to egress. The external string also works.
      #
      # Free-plan expiry still applies to whichever database is used: a free
      # Render Postgres expires 30 days after creation, has a 14-day grace
      # period, and is then DELETED with all of its data. Move to a paid plan
      # if the memory has to outlive that.
      - key: DATABASE_URL
        sync: false

# No `databases:` block on purpose — see the note above. Adding one would have
# Render provision a second Postgres rather than use the existing one.
